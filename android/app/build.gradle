apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

project.ext.envConfigFiles = [
   productiondebug: ".env.production",
   productionrelease: ".env.production",
   stagingrelease: ".env.staging",
   stagingdebug: ".env.staging"
]

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"


react {
  
    autolinkLibrariesWithApp()
}


def enableProguardInReleaseBuilds = false


def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion


   flavorDimensions = ["default"]
       productFlavors {
        production {
            minSdkVersion rootProject.ext.minSdkVersion
            applicationId "com.ecommerce_app"
            targetSdkVersion rootProject.ext.targetSdkVersion
            resValue "string", "build_config_package", "com.ecommerce_app"
             buildConfigField "String", "ENVFILE", "\".env.production\""
        }
        staging {
            minSdkVersion rootProject.ext.minSdkVersion
            applicationId "com.ecommerce_app"
            versionNameSuffix "-staging"
            targetSdkVersion rootProject.ext.targetSdkVersion
            resValue "string", "build_config_package", "com.ecommerce_app"
            buildConfigField "String", "ENVFILE", "\".env.staging\""
        }
    }

    namespace "com.ecommerce_app"
    defaultConfig {
        applicationId "com.ecommerce_app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
         resValue "string", "build_config_package", "com.ecommerce_app"
    }
    signingConfigs {
      
    release {
        storeFile file(RELEASE_STORE_FILE)
        storePassword RELEASE_STORE_PASSWORD
        keyAlias RELEASE_KEY_ALIAS
        keyPassword RELEASE_KEY_PASSWORD
    }


        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
         
            
              signingConfig signingConfigs.release
        minifyEnabled false
        shrinkResources false
            // minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.google.firebase:firebase-analytics")
    implementation(platform("com.google.firebase:firebase-bom:34.9.0"))


    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
