name: Android Staging Build

on:
  push:
    branches:
      - staging

  pull_request:
    branches:
      - staging

  workflow_dispatch:

jobs:
  android-build:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: node-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\Yarn\Cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install npm dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test --ci

      - name: Set Android SDK env
        shell: powershell
        run: |
          echo "ANDROID_HOME=$env:LOCALAPPDATA\Android\Sdk" >> $env:GITHUB_ENV
          echo "$env:LOCALAPPDATA\Android\Sdk\platform-tools" >> $env:GITHUB_PATH

      - name: Restore release keystore
        if: github.event_name == 'push'
        shell: powershell
        run: |
          $b64 = "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          Set-Content -Path keystore.b64 -Value $b64
          certutil -decode keystore.b64 android\app\release-key.keystore

      - name: Verify keystore file
        shell: powershell
        run: |
          Get-ChildItem android\app

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.gradle\caches
            C:\Users\runneradmin\.gradle\wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Android Release APK
        shell: cmd
        run: |
          cd android
          gradlew assembleRelease --build-cache --parallel

      - name: Upload APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-staging-apk
          path: android\app\build\outputs\apk\release\*.apk
